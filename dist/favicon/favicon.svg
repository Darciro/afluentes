      <use href="#a" transform="translate(-40 34)"/>
      <use href="#a" transform="translate(-39 33.15)"/>
      <use href="#a" transform="translate(-38 32.3)"/>
      <use href="#a" transform="translate(-37 31.45)"/>
      <use href="#a" transform="translate(-36 30.6)"/>
      <use href="#a" transform="translate(-35 29.75)"/>
