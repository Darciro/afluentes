      <use href="#a" transform="translate(-15 12.75)"/>
      <use href="#a" transform="translate(-14 11.9)"/>
      <use href="#a" transform="translate(-13 11.05)"/>
      <use href="#a" transform="translate(-12 10.2)"/>
      <use href="#a" transform="translate(-11 9.35)"/>
      <use href="#a" transform="translate(-10 8.5)"/>
      <use href="#a" transform="translate(-9 7.65)"/>
      <use href="#a" transform="translate(-8 6.8)"/>
      <use href="#a" transform="translate(-7 5.95)"/>
      <use href="#a" transform="translate(-6 5.1)"/>
