<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Afluentes</title>
  <defs>
    <!-- A estilizado (serifa "toscana" do logotipo, simplificada) -->
    <path id="a" fill-rule="evenodd" d="M88 448 L184 112 L160 112 L168 64 L344 64 L352 112 L328 112 L424 448 L448 448 L440 472 L304 472 L312 448 L334 448 L314 376 L198 376 L178 448 L200 448 L208 472 L72 472 L64 448 Z M218 304 L294 304 L256 168 Z"/>
    <!-- extrusão: faixas verde / laranja / vermelho como na pintura do logo -->
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="500">
      <stop offset="0" stop-color="#3E9A4A"/>
      <stop offset=".42" stop-color="#3E9A4A"/>
      <stop offset=".42" stop-color="#EE9A45"/>
      <stop offset=".72" stop-color="#EE9A45"/>
      <stop offset=".72" stop-color="#D9364A"/>
      <stop offset="1" stop-color="#D9364A"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="472">
      <stop offset="0" stop-color="#1A92C9"/>
      <stop offset=".55" stop-color="#1A92C9"/>
      <stop offset=".55" stop-color="#0E68AA"/>
      <stop offset="1" stop-color="#0E68AA"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#FEFDE9"/>

  <g transform="translate(30 -14) scale(0.92) translate(22 22)">
    <!-- contorno branco de todo o bloco -->
    <g stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round" fill="#FFFFFF">
      <use href="#a" transform="translate(-40 34)"/>
      <use href="#a"/>
    </g>
    <!-- extrusão (cópias em degraus até a face) -->
